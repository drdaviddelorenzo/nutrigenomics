# Publishes skills/<name>/ to ClawHub. MANUAL ONLY — see below.
#
# ClawHub and Hermes are both fed from this repository:
#   - ClawHub  <- the ClawHub web GitHub importer (current method), or this workflow
#   - Hermes   <- `hermes skills tap add drdaviddelorenzo/nutrigenomics`, which reads skills/
# so `skills/` is the layout both registries expect. Do not move it.
#
# This workflow is deliberately NOT triggered on push. It needs a repository secret
# CLAWHUB_TOKEN, and without one every push would fail the run for no reason. ClawHub is
# currently published via the web importer instead, which needs no token because it reads this
# repository directly as the signed-in GitHub user.
#
# To switch back to automatic publishing: obtain a token with `clawhub login --device` (it
# prints a one-time code and URL; authorise via GitHub and the CLI stores the token), add it as
# the CLAWHUB_TOKEN repository secret, then restore the push trigger below. Publishing is
# idempotent — the CLI compares the local bundle fingerprint against ClawHub and exits
# successfully when the content is already published, so re-runs are safe.
#
#  on:
#    push:
#      branches: [main]
#      paths: ['skills/**', '.github/workflows/publish-clawhub.yml']

name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only — no publish
        type: boolean
        default: true

jobs:
  publish:
    # The called workflow requests id-token: write. A reusable workflow cannot hold more
    # permission than its caller, and this repository's default is read-only, so the caller
    # must grant these explicitly or the run fails at startup before any job begins.
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: skills/nutrigenomics
      owner: drdaviddelorenzo
      dry_run: ${{ inputs.dry_run }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
